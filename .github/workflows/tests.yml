name: Tests & Parity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest
      - name: Install pytest
        run: pip install pytest
      - name: Run pytest
        run: python -m pytest -q

  parity:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate standalone build
        run: python tools/build_standalone.py
      - name: Check for uncommitted changes
        run: |
          if ! git diff --quiet; then
            echo "::error::Parity check failed: web/standalone.html and/or docs/index.html changed after regenerating. Commit the updated build artifacts."
            git diff --stat
            exit 1
          fi
          echo "Parity OK: web/standalone.html and docs/index.html match source."

  build-exe:
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Windows executable
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name bones-and-bullets bones_bullets/__main__.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bones-and-bullets-windows
          path: dist/bones-and-bullets.exe
